######################## custom scripts & styles ####################

# Logo shown in the header (and footer). The round NYKP logo reads well on
# both light and dark backgrounds.
logo_on_white: "/img/logo.png"
logo_on_black: "/img/logo.png"
# Reassembles spam-obfuscated email links (see layouts/shortcodes/email.html)
custom_js: ["/js/email.js"]
# NYKP brand overrides (black/yellow/blue palette, image buttons, footer logo chip)
custom_css: ["/css/custom.css"]

